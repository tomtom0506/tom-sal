name: nightly-fetch
on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install israeli-prices==0.2.0
      - run: python scripts/fetch.py
      - name: Publish to data branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan data
          git rm -rq --cached .
          git add -f out/sal.db out/summary.json
          git commit -qm "data $(date -u +%F)"
          git push -f origin data
