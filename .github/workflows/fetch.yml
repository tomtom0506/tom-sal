name: nightly-fetch
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if the run kept much fewer stores than the previous one"
        type: boolean
        default: false
  schedule:
    - cron: "0 1 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # the token is not left in .git/config, so third-party code run below cannot push with it
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install israeli-prices==0.2.0
      - name: Get previous data (fallback for stores that fail today)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          if gh release view data 2>&1 | grep -qi "release not found"; then
            echo "no data release yet (first run)"; exit 0
          fi
          for i in 1 2 3; do
            gh release download data -p sal.db.gz -D prev --clobber && break
            sleep 20
          done
          # without yesterday's data there is no fallback and no size check: do not run blind
          test -f prev/sal.db.gz || { echo "::error::could not download previous data"; exit 1; }
          gunzip -f prev/sal.db.gz
      - name: Fetch (fails without publishing if the run is empty or shrank a lot)
        env:
          FORCE_PUBLISH: ${{ inputs.force && '1' || '0' }}
        run: python scripts/fetch.py
      - name: Publish to data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data >/dev/null 2>&1 || gh release create data --title "data" --notes "nightly data"
          # keep the previous night as a second asset before overwriting
          if [ -f prev/sal.db ]; then gzip -9 -c prev/sal.db > out/sal-prev.db.gz && gh release upload data out/sal-prev.db.gz --clobber; fi
          gh release upload data out/sal.db.gz out/summary.json --clobber
      - run: python scripts/export.py
      - name: Build site
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q librsvg2-bin
          cp index.html icon.svg site/
          rsvg-convert -w 512 -h 512 icon.svg -o site/icon-512.png
          rsvg-convert -w 180 -h 180 icon.svg -o site/apple-touch-icon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
