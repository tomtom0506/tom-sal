<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="tom-sal">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E1F44">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<title>tom-sal</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--sh:0 1px 3px rgba(14,31,68,.06),0 4px 14px rgba(14,31,68,.05);--navy:#0E1F44;--blue:#1F3A6E;--gold:#D9A940;--silver:#C9D1DC;--bg:#F3F5F8;--card:#fff;--text:#14213D;--muted:#6B7689;--line:#E2E6EC;--green:#1B8A5A;--red:#C0392B;
 --bar:#2F5597;--bar-best:#B8860B;--bar-part:#B9C2D0;--hl:#FFF6DF;--grid:#EDF0F4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1328;--card:#14213D;--text:#EEF1F6;--muted:#9AA6BA;--line:#24345A;--red:#FF7A6B;--sh:none;--bar:#6B93DB;--bar-best:#C99A2E;--bar-part:#3D4E74;--hl:#2A3150;--grid:#1C2B4D}}
:root[data-theme="dark"]{--bg:#0A1328;--card:#14213D;--text:#EEF1F6;--muted:#9AA6BA;--line:#24345A;--red:#FF7A6B;--sh:none;--bar:#6B93DB;--bar-best:#C99A2E;--bar-part:#3D4E74;--hl:#2A3150;--grid:#1C2B4D}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Heebo,system-ui,-apple-system,sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#132A5C 0%,var(--navy) 100%);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;box-shadow:0 2px 12px rgba(5,12,30,.25)}
.top{display:flex;align-items:center;gap:10px}
.top img{width:34px;height:34px;border-radius:9px}
.top h1{font-size:20px;margin:0;font-weight:700}
nav{display:flex;margin-top:10px}
nav button{flex:1;background:none;border:0;color:var(--silver);font:inherit;font-size:15px;padding:10px 4px 9px;border-bottom:3px solid transparent;transition:color .15s,border-color .15s}
nav button.on{color:#fff;border-color:var(--gold);font-weight:500}
nav button .ic{display:block;font-size:18px;line-height:1.1;margin-bottom:1px}
main{padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 40px);max-width:640px;margin:0 auto}
button{-webkit-tap-highlight-color:transparent;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input[type=search]{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);box-shadow:var(--sh);transition:border-color .15s,box-shadow .15s}
input[type=search]:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,169,64,.25)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:12px;overflow:hidden;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.grow{flex:1;min-width:0}
.name{font-weight:500}
.sub{color:var(--muted);font-size:13px}
.qty{display:flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:2px;flex:none}
.qty b{min-width:46px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}
.qty button{width:30px;height:30px;border-radius:50%;border:0;background:var(--card);color:var(--text);font-size:17px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.add{width:34px;height:34px;border-radius:50%;font-size:19px;transition:transform .1s}
.add:active,.qty button:active{transform:scale(.9)}
.add{background:var(--navy);color:#fff;border:0;flex:none}
h2{font-size:15px;color:var(--muted);font-weight:500;margin:20px 4px 0;display:flex;align-items:center;gap:8px}
h2 .lnk{margin-inline-start:auto}
.lnk{background:none;border:0;color:var(--bar);font:inherit;font-size:13px;padding:4px 0;text-decoration:underline}
.store{padding:14px;scroll-margin-top:140px}
.store .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.total{font-size:22px;font-weight:700}
.reg{text-decoration:line-through;color:var(--muted);font-size:14px;margin-inline-end:6px}
.best{border:2px solid var(--gold)}
.badge{display:inline-block;background:var(--gold);color:#1a1a1a;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700;margin-inline-start:6px}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:0 6px;background:#E7F5EE;color:var(--green);margin-top:2px}
.tag.club{background:#FFF3D6;color:#8A5A00}
.miss{color:var(--red);font-size:13px}
details summary{color:var(--muted);font-size:13px;margin-top:6px;cursor:pointer}
.line{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:4px 0;border-top:1px dashed var(--line)}
.empty{color:var(--muted);text-align:center;padding:24px 10px}
.hero{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:26px 18px;text-align:center;margin-top:14px}
.hero .big{font-size:40px;line-height:1}
.hero .name{font-size:17px;margin:10px 0 4px}
.hero .sub{font-size:14px;line-height:1.5}
.hero ol{text-align:start;color:var(--muted);font-size:14px;line-height:1.7;margin:12px auto 0;max-width:320px;padding-inline-start:20px}
.cta{display:inline-block;margin-top:14px;background:var(--navy);color:#fff;border:1px solid var(--gold);border-radius:22px;padding:9px 20px;font:inherit;font-size:15px}
.av{flex:none;width:36px;height:36px;border-radius:10px;background:var(--grid);color:var(--text);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.rank{flex:none;width:24px;height:24px;border-radius:50%;background:var(--grid);color:var(--muted);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-inline-end:6px;vertical-align:1px}
.best .rank{background:var(--gold);color:#1a1a1a}
.who{display:flex;align-items:center;gap:10px;min-width:0}
details.bk>summary{list-style:none;display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);font-weight:500;margin:20px 4px 0}
details.bk>summary::-webkit-details-marker{display:none}
details.bk>summary::after{content:"▾";margin-inline-start:4px;transition:transform .15s}
details.bk:not([open])>summary::after{transform:rotate(90deg)}
details.bk>summary .lnk{margin-inline-start:auto}
.hidden{display:none}
.tip{padding:12px 14px;border:1px solid var(--gold)}
.tip .name{font-size:16px}
.fill{font-size:13px;color:var(--muted);margin-top:3px}
.peek{color:var(--gold);font-size:12px;font-weight:400;white-space:nowrap}
.from{color:var(--green);font-weight:500;white-space:nowrap}
.stale{color:var(--red);font-size:12px;font-weight:400;white-space:nowrap}
[data-view]{cursor:pointer}
.addbig{display:block;width:100%;margin:12px 0 6px;background:var(--navy);color:#fff;border:1px solid var(--gold);border-radius:12px;padding:11px;font:inherit;font-size:16px}
.sbox{position:relative}
.sbox input{padding-inline-end:100px}
.sbox input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.clrb{position:absolute;inset-inline-end:54px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:var(--line);color:var(--text);font-size:17px}
.clrb.hidden{display:none}
.scanb{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:42px;height:38px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:19px}
#scan{position:fixed;inset:0;z-index:12;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#scan.hidden{display:none}
#reader{width:100%;max-width:420px}
#scan p{color:#fff;margin:0;font-size:15px;text-align:center}
#scan .photo{color:#F2C75C;font-size:15px;text-decoration:underline}
#scan button{background:#fff;color:#000;border:0;border-radius:22px;padding:10px 26px;font:inherit;font-size:16px}
.price{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;justify-content:flex-end}
.ends{color:var(--red);font-weight:700}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);z-index:13;background:var(--green);color:#fff;border-radius:12px;padding:10px 16px;font-size:15px;max-width:90%}
#toast.hidden{display:none}
.hb{background:rgba(255,255,255,.12);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px}
.ver{background:none;border:0;color:#F2C75C;font:inherit;font-size:13px;font-weight:500;padding:0;-webkit-appearance:none;appearance:none;opacity:1}
.meta{margin-inline-start:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.meta small{color:var(--silver);font-size:12px}
#modal{position:fixed;inset:0;z-index:10;background:rgba(5,12,30,.6);display:flex;align-items:flex-end;justify-content:center}
#modal.hidden{display:none}
#modal .sheet{background:var(--card);color:var(--text);width:100%;max-width:640px;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
#modal h3{margin:0 0 6px;font-size:19px}
#modal h4{margin:16px 0 4px;font-size:15px}
#modal p,#modal li{font-size:15px;line-height:1.6;margin:4px 0}
#modal .close{float:left;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:50%;width:32px;height:32px;font-size:16px}
.cl{border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
.cl b{color:var(--gold)}
/* ---- summary tiles ---- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0;box-shadow:var(--sh)}
.tile.wide{background:linear-gradient(135deg,var(--card) 60%,var(--hl) 100%);border-color:var(--gold)}
.tile.wide{grid-column:1/-1}
.tile .k{color:var(--muted);font-size:13px}
.tile .v{font-size:24px;font-weight:700;line-height:1.25}
.tile.wide .v{font-size:34px}
.tile .s{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.tile .save{color:var(--green)}
/* ---- ranked bar chart (horizontal, RTL: bars grow from the right) ---- */
.chart{padding:12px 14px 8px}
.chart .ttl{font-weight:500;font-size:15px}
.chart .cap{color:var(--muted);font-size:12px;margin-bottom:6px}
.bar{display:grid;grid-template-columns:minmax(84px,34%) 1fr 92px;align-items:center;gap:8px;width:100%;padding:5px 0;background:none;border:0;color:inherit;font:inherit;text-align:start;cursor:pointer;border-radius:8px}
.bar:hover .fw,.bar:focus-visible .fw{background:var(--grid)}
.bar .lbl{font-size:13px;line-height:1.25;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .lbl small{display:block;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.fw{min-width:0;border-radius:4px}
.fillb{display:block;height:16px;background:var(--bar);border-radius:4px 0 0 4px;min-width:3px}
.fillb.best{background:var(--bar-best)}
.fillb.part{background:var(--bar-part)}
.bar .val{font-size:13px;font-weight:500;line-height:1.2;font-variant-numeric:tabular-nums}
.bar .val small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:12px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:4px;vertical-align:-1px}
/* ---- item x store table ---- */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.mx{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.mx th,.mx td{padding:7px 8px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
.mx th{font-weight:500;color:var(--muted);font-size:12px;vertical-align:bottom;white-space:normal;min-width:70px}
.mx th:first-child,.mx td:first-child{text-align:start;white-space:normal;min-width:110px;max-width:160px;position:sticky;right:0;background:var(--card)}
.mx td.cheap{background:var(--hl);font-weight:700}
.mx td.na{color:var(--muted)}
.mx tr.sum td{font-weight:700;border-top:2px solid var(--line)}
.seg{display:flex;gap:6px;margin-top:10px}
.seg button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px;font:inherit;font-size:14px}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ctl{display:flex;gap:8px;align-items:center;margin-top:12px}
.ctl input{flex:1}
.chip{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:16px;padding:6px 12px;font:inherit;font-size:13px;white-space:nowrap}
</style>
</head>
<body>
<header>
 <div class="top"><img src="apple-touch-icon.png" alt=""><h1>הסל שלי</h1>
  <div class="meta"><button class="ver" id="ver"></button><small id="upd"></small></div>
  <button class="hb" id="refresh" aria-label="רענון הנתונים">🔄</button>
  <button class="hb" id="theme" aria-label="מצב יום או לילה">🌙</button>
  <button class="hb" id="help" aria-label="מדריך">❔</button></div>
 <nav><button id="tb" class="on"><span class="ic">🛒</span>סל</button><button id="ts"><span class="ic">🏪</span>סניפים <span id="nsel"></span></button><button id="tc"><span class="ic">💳</span>מועדונים <span id="ncl"></span></button></nav>
</header>
<main>
 <section id="vb">
  <div class="sbox"><input type="search" id="q" placeholder="חיפוש מוצר או ברקוד" autocomplete="off"><button class="clrb hidden" id="clrb" aria-label="ניקוי החיפוש">✕</button><button class="scanb" id="scanb" aria-label="סריקת ברקוד">📷</button></div>
  <div id="res"></div>
  <div id="bask"></div>
  <div class="sub" id="clubnote" style="margin-top:12px"></div>
  <div id="cmp"></div>
 </section>
 <section id="vs" class="hidden"><div id="stores"></div></section>
 <section id="vc" class="hidden"><div id="clubs"></div></section>
</main>
<div id="scan" class="hidden"><p>כוון לברקוד ממרחק 15–20 ס"מ, באור טוב</p><div id="reader"></div><label class="photo">📸 לא מצליח? צלם תמונה של הברקוד<input type="file" id="photo" accept="image/*" capture="environment" hidden></label><button id="scanx">ביטול</button></div><div id="scanfile" hidden></div>
<div id="toast" class="hidden"></div>
<div id="modal" class="hidden"><div class="sheet" id="sheet"></div></div>
<script>
const VERSION = "1.6.1";
const CHANGELOG = [
 ["1.6.1", "20.11.2026", ["העדכון הלילי הוקדם לשעה לא עגולה (02:37 בחורף, 03:37 בקיץ), כי GitHub נוהג לדחות ריצות שנקבעו על שעה עגולה. בימים האחרונים העדכון הגיע רק בסביבות 10:00 בבוקר", "המדריך מסביר מתי הנתונים מתעדכנים ואיך לדעת שהם עדכניים"]],
 ["1.6.0", "20.11.2026", [
  "גרפים: גרף עמודות של מחיר הסל בכל סניף, וגרף מחירים לכל מוצר בכל הסניפים",
  "סיכום בראש ההשוואה: הסל הכי זול, כמה חוסכים לעומת הסניף היקר, ומחיר ממוצע",
  "טבלת השוואה לפי מוצר: כל מוצר מול הסניפים המובילים, עם סימון של הזול ביותר בכל שורה",
  "בתוצאות החיפוש מופיע המחיר הכי נמוך בסניפים שבחרת",
  "מוצרים במשקל: כמות בקפיצות של חצי ק\"ג",
  "כפתור לריקון הסל, וחיפוש וסימון של כל סניפי הרשת בלשונית הסניפים",
  "תיקון: מבצע \"X ב-Y\" כשהכמות לא מתחלקת במדויק, למשל 3 יחידות במבצע 2 ב-20, מחושב נכון",
  "תיקון: מבצע \"השני ב-X%\" חל רק על היחידה השנייה",
  "תיקון: מבצעים שעוד לא התחילו או שכבר נגמרו לא נספרים",
  "תיקון: סניף שלא עודכן לילה אחד לא נמחק מהבחירה שלך. הוא מוצג עם תאריך הנתונים שלו",
  "תיקון: ירקות ארוזים במשקל קבוע לא מושווים יותר למחיר לק\"ג, וחבילות בגדלים שונים מוצגות בנפרד",
  "תיקון: סריקת ברקוד של ביצים ומוצרים מקובצים מוצאת אותם",
  "תאריך העדכון למעלה מציג את תאריך הנתונים עצמם",
  "עיצוב מחודש: כרטיסים רכים יותר, אייקונים בלשוניות, דירוג ממוספר לכל סניף ומסך פתיחה עם הסבר",
  "כפתור הרענון עבר לשורה העליונה ולא מסתיר יותר את התוכן",
  "אפשר לכווץ את רשימת הסל כדי לראות מיד את ההשוואה"]],
 ["1.5.1", "31.10.2026", ["סדר ההשוואה: קודם סניפים שיש בהם את כל הסל מהזול ליקר, אחריהם סניפים שחסר בהם מעט, ובסוף השאר", "סינון מחירים חריגים בירקות ומוצרים במשקל, למשל מלפפון ב-₪1.80 לק\"ג, שהם כמעט תמיד טעות יחידות בקובץ הרשת"]],
 ["1.5.0", "30.10.2026", ["לשונית חדשה \"מועדונים\": מסמנים באילו מועדוני רשתות, כרטיסי אשראי ומועדוני הטבות אתה חבר", "מבצעי מועדון נספרים רק ברשתות שסימנת שאתה חבר במועדון שלהן", "הכול נשמר רק בטלפון, בלי מספרי כרטיס או פרטים אישיים"]],
 ["1.4.3", "30.10.2026", ["חישוב מדויק יותר של מבצעי \"X ב-Y\" גם כשמחיר המבצע נמוך ממחיר יחידה", "קופונים והטבות על סכום קנייה לא נספרים יותר כמחיר של מוצר", "רשת שלא עדכנה היום מוצגת עם נתוני אתמול ומסומנת"]],

// ==calc-start== pure price logic, unit tested in tests/calc.test.js (no DOM, no globals)
const C = (() => {
 // promo row: [description, end, club, min_qty, discounted_price, rate, start]
 const rate = dr => dr == null || !(dr > 0) ? null : dr >= 1 ? dr / 100 : dr;
 const isClub = club => typeof club === "number" ? club !== 0 : !/^\s*(0|$)|כלל הלקוחות/.test(String(club ?? "0"));
 const promoOk = (pr, today) => !((pr[1] && pr[1] < today) || (pr[6] && pr[6] > today));
 // Total price of q units with this promo, or null if the promo does not apply.
 function promoLine(price, pr, q) {
  const d = pr[0], dp = pr[4], r = rate(pr[5]);
  const mq = pr[3] >= 1 ? pr[3] : 1;
  if (q < mq) return null;
  if (dp != null && dp > 0) {
   if (mq <= 1) return dp * q;
   const per = dp / mq;
   let bundle;                               // "2 ב-20": dp is the price of the whole bundle
   if (dp > price) bundle = true;
   else if (r) bundle = Math.abs((1 - per / price) - r) < Math.abs((1 - dp / price) - r);
   else { const m = String(d || "").match(/(\d+)\s*ב[-־ ]?\s*₪?\s*(\d+(?:\.\d+)?)/); bundle = !!(m && +m[1] === mq && Math.abs(+m[2] - dp) < 0.01); }
   // units outside full bundles are paid at the regular price
   return bundle ? Math.floor(q / mq + 1e-9) * dp + (q - Math.floor(q / mq + 1e-9) * mq) * price : dp * q;
  }
  if (r && r < 1) {
   if (mq <= 1) return price * (1 - r) * q;
   return (q - Math.floor(q / mq + 1e-9) * r) * price;  // "השני ב-50%": one discounted unit per group of mq
  }
  return null;
 }
 // Cheapest way to buy q of any of `codes` in store file f. clubOk: are club promos allowed in this chain.
 function bestIn(f, codes, q, clubOk, today) {
  let best = null;
  for (const cc of codes) {
   const raw = f.p[cc], price = Array.isArray(raw) ? raw[0] : raw;
   if (!(price > 0)) continue;
   let v = price * q, why = null;
   for (const pid of (f.l && f.l[cc]) || []) {
    const pr = f.pr[pid]; if (!pr || !promoOk(pr, today)) continue;
    const club = isClub(pr[2]); if (club && !clubOk) continue;
    const t = promoLine(price, pr, q);
    if (t != null && t > 0 && t < v - 1e-9) { v = t; why = { d: pr[0], club, end: pr[1] }; }
   }
   if (!best || v < best.v) best = { v, unit: v / q, regp: price, reg: price * q, why, code: cc };
  }
  return best;
 }
 // cheapest pair of stores that together cover the basket. M: sid -> item -> {v} | null
 function bestPair(sids, items, M) {
  let bp = null;
  for (let i = 0; i < sids.length; i++) for (let j = i + 1; j < sids.length; j++) {
   const a = sids[i], b = sids[j]; let sum = 0, ok = true; const take = { [a]: [], [b]: [] }, part = { [a]: 0, [b]: 0 };
   for (const c of items) {
    const ra = M[a][c], rb = M[b][c];
    if (!ra && !rb) { ok = false; break; }
    const w = !rb || (ra && ra.v <= rb.v) ? a : b, v = (w === a ? ra : rb).v;
    sum += v; take[w].push(c); part[w] += v;
   }
   if (ok && take[a].length && take[b].length && (!bp || sum < bp.sum)) bp = { sum, take, part, a, b };
  }
  return bp;
 }
 const kgStep = isKg => isKg ? 0.5 : 1;
 const fmtQty = (q, isKg) => isKg ? (Number.isInteger(q) ? q : q.toFixed(1)) + ' ק"ג' : String(q);
 return { rate, isClub, promoOk, promoLine, bestIn, bestPair, kgStep, fmtQty };
})();
// ==calc-end==

async function getJSON(u) { const r = await fetch(u, { cache: "no-cache" }); if (!r.ok) throw new Error(u + " " + r.status); return r.json(); }
async function catalog() { if (!S.cat) { $("res").innerHTML = '<div class="empty">טוען קטלוג…</div>'; S.cat = await getJSON("data/catalog.json"); if ($("q").value.trim().length < 2) $("res").innerHTML = ""; } return S.cat; }

// one failing store file must not blank the whole basket: load what we can, remember what failed
async function files() {
 const want = [...S.sel].filter(s => known(s) && !S.files[s]);
 const res = await Promise.allSettled(want.map(async s => { S.files[s] = await getJSON(`data/s/${encodeURIComponent(s)}.json`); }));
 res.forEach((r, i) => r.status === "rejected" ? S.bad.add(want[i]) : S.bad.delete(want[i]));
}
const stOf = sid => S.stores.find(s => s.sid === sid);
const cands = c => c.startsWith("g:") ? (S.cat?.[c]?.[5] || []) : [c];
const kg = c => !!(c.startsWith("g:") && S.cat?.[c]?.[4]);
const best = (sid, c, q) => { const f = S.files[sid], st = stOf(sid); return f && st ? C.bestIn(f, cands(c), q, S.chainClubs.has(st.chain), TODAY) : null; };
const staleTag = st => st && st.date && st.date < S.updated ? ` <span class="stale">· נתוני ${dmy(st.date)}</span>` : "";

function clearSearch() { $("q").value = ""; $("res").innerHTML = ""; $("clrb").classList.add("hidden"); $("q").blur(); }
$("clrb").onclick = clearSearch;
const loaded = () => [...S.sel].filter(s => S.files[s]);
async function search() {
 const q = $("q").value.trim();
 if (q.length < 2) { $("res").innerHTML = ""; return; }
 const cat = await catalog(); await files();
 const words = q.split(/\s+/).filter(Boolean), digits = /^\d{4,}$/.test(q), full = [], part = [], pin = [];
 for (const code in cat) {
  const e = cat[code], t = e[0] + " " + (e[1] || "");
  if (digits) { if (code.includes(q) || (e[5] && e[5].some(x => x.includes(q)))) full.push(code); continue; }
  let k = 0; for (const w of words) if (t.includes(w)) k++;
  // a generic group ("מלפפון") whose whole name appears in the query ("מלפפון ירוק") is pinned to the top
  if (code.startsWith("g:") && e[0].split(" ").every(w => words.includes(w))) pin.push(code);
  else if (k === words.length) full.push(code); else if (k > 0) part.push([code, k]);
 }
 part.sort((a, b) => b[1] - a[1]);
 const out = full.length >= 5 ? full : full.concat(part.slice(0, 300).map(x => x[0]));
 const L = loaded();
 const have = c => L.filter(s => cands(c).some(x => S.files[s].p[x])).length;
 const sc = {}; out.forEach(c => sc[c] = have(c));
 out.sort((a, b) => sc[b] - sc[a] || (b.startsWith("g:") - a.startsWith("g:")) || cat[a][0].length - cat[b][0].length);
 out.unshift(...pin.sort((a, b) => cat[b][0].length - cat[a][0].length).map(c => (sc[c] = have(c), c)));
 $("res").innerHTML = out.length ? '<div class="box">' + out.slice(0, 30).map(c => {
  const [n, m, qn, u] = cat[c];
  let lo = null; L.forEach(s => { const r = best(s, c, 1); if (r && (lo === null || r.unit < lo)) lo = r.unit; });
  return `<div class="row"><div class="grow" data-view="${esc(c)}"><div class="name">${esc(n)} <span class="peek">› מחירים</span></div>
   <div class="sub">${lo !== null ? `<span class="from">מ-${ils(lo)}${kg(c) ? ' לק"ג' : ""}</span> · ` : ""}${c.startsWith("g:") ? "כל הרשתות" + (cat[c][4] ? " · במשקל" : "") : esc(m || "") + " " + (qn ? esc(qn + " " + (u || "")) : "")} · ב-${sc[c]} מתוך ${S.sel.size} סניפים</div></div>
   <button class="add" data-add="${esc(c)}" aria-label="הוסף לסל">+</button></div>`;
 }).join("") + "</div>" : '<div class="empty">לא נמצא מוצר</div>';
}
function addToBasket(c) { S.basket[c] = S.basket[c] ? +(S.basket[c] + C.kgStep(kg(c))).toFixed(2) : 1; store("basket", S.basket); }

function clubNote() {
 const n = S.chainClubs.size;
 $("clubnote").innerHTML = n ? `מבצעי מועדון נספרים ב-${n} רשתות שסימנת. לשינוי: לשונית "מועדונים".` : `מבצעי מועדון לא נספרים. אם אתה חבר במועדון של רשת, סמן אותו בלשונית "מועדונים".`;
}

// ---- compare ----
function compare(cat) {
 clubNote();
 if (!S.sel.size) { $("cmp").innerHTML = '<div class="hero"><div class="big">🏪</div><div class="name">עוד לא בחרת סניפים</div><div class="sub">בחר את הסניפים שאתה קונה בהם, ונשווה את הסל ביניהם.</div><button class="cta" data-goto="s">בחירת סניפים</button></div>'; return; }
 const nm = c => esc(nmRaw(c));
 const stores = [...S.sel].filter(known).map(sid => ({ sid, st: stOf(sid), f: S.files[sid] })).filter(x => x.f);
 const M = {};
 stores.forEach(x => { M[x.sid] = {}; Object.entries(S.basket).forEach(([c, q]) => { M[x.sid][c] = best(x.sid, c, q); }); });
 // an item no selected store sells must not make every store "incomplete": compare the rest, list it separately
 const nowhereAll = Object.keys(S.basket).filter(c => stores.every(x => !M[x.sid][c]));
 const items = Object.entries(S.basket).filter(([c]) => !nowhereAll.includes(c)), n = items.length;
 const label = sid => { const st = stOf(sid); return esc(st.he + " " + st.name); };
 const cheapestElse = (c, not) => { let b = null; stores.forEach(x => { const r = M[x.sid][c]; if (x.sid !== not && r && (!b || r.v < b.v)) b = { sid: x.sid, v: r.v }; }); return b; };

 const rows = stores.map(({ sid, st }) => {
  let reg = 0, tot = 0; const lines = [], missing = [];
  items.forEach(([c, q]) => {
   const r = M[sid][c]; if (!r) { missing.push(c); return; }
   reg += r.reg; tot += r.v;
   lines.push(`<div class="line"><span>${nm(c)} ×${C.fmtQty(q, kg(c))}${promoTag(r.why)}</span><b>${ils(r.v)}</b></div>`);
  });
  const fill = {}; let fillSum = 0; const nowhere = [];
  missing.forEach(c => { const b = cheapestElse(c, sid); if (!b) { nowhere.push(c); return; } (fill[b.sid] ||= { v: 0, items: [] }); fill[b.sid].v += b.v; fill[b.sid].items.push(c); fillSum += b.v; });
  return { sid, st, reg, tot, lines, missing, fill, fillSum, nowhere, full: tot + fillSum };
 }).filter(r => r.lines.length > 0);
 // tier 0: complete; tier 1: missing at most a quarter of the basket (min 1) -> ranked by total incl. completion
 const tier = r => !r.missing.length ? 0 : r.missing.length <= Math.max(1, Math.floor(n / 4)) ? 1 : 2;
 rows.sort((a, b) => tier(a) - tier(b) || a.full - b.full);
 const hidden = stores.length - rows.length;
 const singles = rows.filter(r => !r.missing.length);
 const bestSingle = singles[0] || null;
 const pair = C.bestPair(stores.map(x => x.sid), items.map(([c]) => c), M);

 // summary tiles
 let tiles = "";
 if (bestSingle) {
  const worst = singles[singles.length - 1], avg = singles.reduce((s, r) => s + r.tot, 0) / singles.length;
  tiles = `<div class="tiles"><div class="tile wide"><div class="k">הסל המלא הכי זול</div><div class="v">${ils(bestSingle.tot)}</div><div class="s">${label(bestSingle.sid)}</div></div>
   ${singles.length > 1 ? `<div class="tile"><div class="k">חיסכון מול היקר</div><div class="v save">${ils(worst.tot - bestSingle.tot)}</div><div class="s">${Math.round((worst.tot - bestSingle.tot) / worst.tot * 100)}% פחות מ${esc(worst.st.he)}</div></div>
   <div class="tile"><div class="k">ממוצע ב-${singles.length} סניפים</div><div class="v">${ils(avg)}</div><div class="s">סניפים שיש בהם את כל הסל</div></div>` : ""}</div>`;
 } else if (rows.length) {
  tiles = `<div class="tiles"><div class="tile wide"><div class="k">אין סניף אחד שיש בו את כל הסל</div><div class="v">${ils(rows[0].full)}</div><div class="s">הכי זול כולל השלמה: ${label(rows[0].sid)}</div></div></div>`;
 }

 let tip = "";
 const worth = pair && (!bestSingle || bestSingle.tot - pair.sum >= Math.max(5, bestSingle.tot * 0.03));
 if (worth) {
  const save = bestSingle ? `חוסך ${ils(bestSingle.tot - pair.sum)} לעומת הכול ב${label(bestSingle.sid)}` : "אין סניף אחד שיש בו את כל הסל";
  tip = `<div class="box tip"><div class="name">💡 הכי משתלם: שני סניפים · ${ils(pair.sum)}</div><div class="sub">${save}</div>
   ${[pair.a, pair.b].map(sid => `<div class="line"><span><b>${label(sid)}</b><br><span class="sub">${pair.take[sid].map(nm).join(", ")}</span></span><b>${ils(pair.part[sid])}</b></div>`).join("")}</div>`;
 } else if (bestSingle && n > 1) {
  tip = `<div class="box tip"><div class="name">💡 הכי משתלם: הכול ב${label(bestSingle.sid)} · ${ils(bestSingle.tot)}</div><div class="sub">פיצול בין שני סניפים לא חוסך מספיק כדי להצדיק נסיעה נוספת</div></div>`;
 }

 // chart: one bar per store, same order as the cards
 const anyPart = rows.some(r => r.missing.length);
 const chart = barChart("מחיר הסל בכל סניף", anyPart ? "בסניפים שחסרים בהם מוצרים: המחיר כולל השלמה בסניף אחר" : "כולל מבצעים", rows.map((r, i) => ({
  v: r.full, go: "st-" + r.sid, kind: !r.missing.length ? (r === bestSingle ? "best" : "") : "part",
  label: shortName(r.st), aria: `${r.st.he} ${r.st.name}: ${ils(r.full)}${r.missing.length ? `, חסרים ${r.missing.length}` : ""}`,
  val: ils0(r.full) + (r.missing.length ? `<small>חסרים ${r.missing.length}</small>` : "") })),
  `<span><i style="background:var(--bar-best)"></i>הכי זול בסניף אחד</span><span><i style="background:var(--bar)"></i>כל הסל</span>${anyPart ? '<span><i style="background:var(--bar-part)"></i>חסרים מוצרים</span>' : ""}`);

 // item x store table: top stores (max 4) side by side, cheapest per row highlighted
 const top = rows.slice(0, 4);
 const table = `<div class="box"><div class="tblwrap"><table class="mx"><thead><tr><th>מוצר</th>${top.map(r => `<th>${esc(r.st.he)}<br><span class="sub">${esc(r.st.name)}</span></th>`).join("")}</tr></thead><tbody>
  ${items.map(([c, q]) => { const vs = top.map(r => M[r.sid][c]?.v ?? null), lo = Math.min(...vs.filter(v => v !== null));
   return `<tr><td>${nm(c)} <span class="sub">×${C.fmtQty(q, kg(c))}</span></td>${vs.map(v => v === null ? '<td class="na">—</td>' : `<td class="${vs.filter(x => x !== null).length > 1 && Math.abs(v - lo) < 0.005 ? "cheap" : ""}">${v.toFixed(2)}${vs.filter(x => x !== null).length > 1 && Math.abs(v - lo) < 0.005 ? " ✓" : ""}</td>`).join("")}</tr>`; }).join("")}
  <tr class="sum"><td>סה"כ</td>${top.map(r => `<td>${r.tot.toFixed(2)}${r.missing.length ? `<br><span class="miss">חסרים ${r.missing.length}</span>` : ""}</td>`).join("")}</tr></tbody></table></div>
  <div class="sub" style="padding:8px 14px">✓ = הכי זול בשורה. — = לא נמכר בסניף. ${rows.length > 4 ? `מוצגים ${top.length} הסניפים המובילים מתוך ${rows.length}.` : ""}</div></div>`;

 const cards = rows.map((r, i) => {
  const isTop = r === bestSingle;
  const fillHtml = Object.entries(r.fill).map(([sid, x]) => `<div class="fill">➕ השלמה ב${label(sid)}: ${x.items.map(nm).join(", ")} · ${ils(x.v)}</div>`).join("")
   + (r.nowhere.length ? `<div class="fill">לא נמכר באף סניף שבחרת: ${r.nowhere.map(nm).join(", ")}</div>` : "");
  return `<div class="box store ${isTop ? "best" : ""}" id="st-${esc(r.sid)}">
  <div class="t"><div class="who"><span class="av" aria-hidden="true">${esc([...r.st.he][0] || "?")}</span><div><div class="name"><span class="rank">${i + 1}</span>${esc(r.st.he)}${isTop ? '<span class="badge">הכי זול בסניף אחד</span>' : ""}</div><div class="sub">${esc(r.st.name)}${staleTag(r.st)}</div></div></div>
  <div class="price"><span class="total">${ils(r.tot)}</span>${r.reg - r.tot > 0.005 ? `<span class="reg">${ils(r.reg)}</span>` : ""}</div></div>
  ${r.missing.length ? `<div class="miss">חסרים ${r.missing.length} מתוך ${n} פריטים: ${r.missing.map(nm).join(", ")}</div>${fillHtml}
   ${r.fillSum ? `<div class="sub"><b>סה"כ כולל השלמה: ${ils(r.full)}</b></div>` : ""}` : ""}
  <details><summary>פירוט</summary>${r.lines.join("")}</details></div>`;
 }).join("");

 const views = [["chart", "📊 גרף"], ["table", "▦ טבלה"], ["cards", "☰ כרטיסים"]];
 const body = S.view === "table" ? table : S.view === "cards" ? "" : chart;
 const bad = [...S.bad].filter(s => S.sel.has(s));
 $("cmp").innerHTML = "<h2>השוואה</h2>" + tiles + tip
  + (rows.length ? `<div class="seg" role="tablist">${views.map(([k, t]) => `<button data-viewmode="${k}" class="${S.view === k ? "on" : ""}" role="tab" aria-selected="${S.view === k}">${t}</button>`).join("")}</div>` + body : "")
  + cards
  + (nowhereAll.length ? `<div class="empty">לא נמכר באף סניף שבחרת: ${nowhereAll.map(nm).join(", ")}</div>` : "")
  + (hidden ? `<div class="empty">${hidden} סניפים לא מוכרים אף מוצר מהסל ולכן לא מוצגים</div>` : "")
  + (bad.length ? `<div class="empty">לא הצלחנו לטעון ${bad.length} סניפים. נסה "רענון".</div>` : "");
}

// ---- barcode scanner ----
let scanner = null;
function toast(t) { $("toast").textContent = t; $("toast").classList.remove("hidden"); setTimeout(() => $("toast").classList.add("hidden"), 2500); }
function loadLib() {
 if (window.Html5Qrcode) return Promise.resolve();
 return new Promise((ok, bad) => { const sc = document.createElement("script");
  sc.src = "https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js";
  sc.integrity = "sha384-c9d8RFSL+u3exBOJ4Yp3HUJXS4znl9f+z66d1y54ig+ea249SpqR+w1wyvXz/lk+"; sc.crossOrigin = "anonymous";
  sc.onload = ok; sc.onerror = bad; document.head.appendChild(sc); });
}
async function stopScan() { try { if (scanner) { await scanner.stop(); scanner.clear(); } } catch {} scanner = null; $("scan").classList.add("hidden"); }
$("scanx").onclick = stopScan;
const FORMATS = () => { const F = Html5QrcodeSupportedFormats; return [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128]; };
// photo fallback: a still photo is far sharper than the live video on iPhone
function shrink(file, max = 1600) {
 return new Promise((ok, bad) => { const img = new Image(); img.onload = () => {
  const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = img.width * k; c.height = img.height * k; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  c.toBlob(b => ok(new File([b], "b.jpg", { type: "image/jpeg" })), "image/jpeg", 0.92); URL.revokeObjectURL(img.src);
 }; img.onerror = bad; img.src = URL.createObjectURL(file); });
}
$("photo").onchange = async e => {
 const f = e.target.files[0]; e.target.value = ""; if (!f) return;
 await stopScan(); toast("מפענח את התמונה…");
 try {
  await loadLib();
  const r = new Html5Qrcode("scanfile", { formatsToSupport: FORMATS(), verbose: false });
  const code = await r.scanFile(await shrink(f), false); r.clear(); onBarcode(code.trim());
 } catch { toast("לא נמצא ברקוד בתמונה. נסה שוב מקרוב ובאור טוב, או הקלד את המספר שמתחת לברקוד."); }
};
$("scanb").onclick = async () => {
 $("scan").classList.remove("hidden");
 try {
  await loadLib();
  scanner = new Html5Qrcode("reader", { formatsToSupport: FORMATS(), verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
  await scanner.start({ facingMode: "environment" }, {
   fps: 15,
   qrbox: (w, h) => ({ width: Math.floor(w * 0.9), height: Math.floor(Math.min(h * 0.4, w * 0.5)) }),
   videoConstraints: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: "continuous" }] }
  }, async code => { await stopScan(); onBarcode(code.trim()); });
 } catch (e) { await stopScan(); toast("לא ניתן לפתוח את המצלמה. אשר גישה למצלמה ב-Safari ונסה שוב."); }
};
async function onBarcode(code) {
 const cat = await catalog();
 const tries = [code, code.replace(/^0+/, ""), "0" + code];
 let hit = tries.find(c => cat[c]);
 // eggs / weighted items live inside a group: find the group that holds this barcode
 if (!hit) for (const g in cat) if (g.startsWith("g:") && cat[g][5].some(x => tries.includes(x))) { hit = g; break; }
 if (hit) { addToBasket(hit); toast("נוסף לסל: " + cat[hit][0]); renderBasket(); }
 else { $("q").value = code; $("clrb").classList.remove("hidden"); search(); toast("הברקוד " + code + " לא נמצא בסניפי האזור"); }
}

};

 [["vb", "tb", "b"], ["vs", "ts", "s"], ["vc", "tc", "c"]].forEach(([sec, btn, k]) => { $(sec).classList.toggle("hidden", v !== k); $(btn).classList.toggle("on", v === k); });

const PLATFORMS = {
 "כרטיסי אשראי": ["ישראכרט", "אמריקן אקספרס", "מקס", "כאל", "דיינרס"],
 "מועדוני הטבות": ["חבר", "בהצדעה", "הייטקזון", "ועד עובדים במקום העבודה"],
};
function clubCount() { return S.chainClubs.size + S.memb.length; }
function renderClubs() {
 const chains = [...new Map(S.stores.map(s => [s.chain, s.he])).entries()].sort((a, b) => a[1].localeCompare(b[1], "he"));
 const custom = S.memb.filter(m => !Object.values(PLATFORMS).flat().includes(m));
 $("clubs").innerHTML = `<p class="sub">סמן רק שמות. לא נשמרים מספרי כרטיס או פרטים אישיים, והכול נשמר רק בטלפון הזה.</p>
  <h2>מועדוני רשתות · משפיע על חישוב הסל</h2><div class="box">${chains.map(([ch, he]) =>
   `<label class="row"><input type="checkbox" data-chain="${esc(ch)}" ${S.chainClubs.has(ch) ? "checked" : ""}><div class="grow"><div class="name">מועדון ${esc(he)}</div></div></label>`).join("")}</div>
  ${Object.entries(PLATFORMS).map(([title, list]) => `<h2>${title} · ישמש את לשונית ההטבות שתגיע בהמשך</h2><div class="box">${list.map(m =>
   `<label class="row"><input type="checkbox" data-memb="${esc(m)}" ${S.memb.includes(m) ? "checked" : ""}><div class="grow"><div class="name">${esc(m)}</div></div></label>`).join("")}</div>`).join("")}
  <h2>אחר</h2><div class="box">${custom.map(m => `<div class="row"><div class="grow"><div class="name">${esc(m)}</div></div><button class="add" data-rm="${esc(m)}">✕</button></div>`).join("")}
   <div class="row"><input type="search" id="newclub" placeholder="שם מועדון או כרטיס נוסף" style="flex:1"><button class="add" id="addclub">+</button></div></div>`;
 $("ncl").textContent = clubCount() ? `(${clubCount()})` : "";
}
$("clubs").addEventListener("change", e => {
 const ch = e.target.dataset.chain, m = e.target.dataset.memb;
 if (ch) { e.target.checked ? S.chainClubs.add(ch) : S.chainClubs.delete(ch); store("chainClubs", [...S.chainClubs]); }
 if (m) { S.memb = e.target.checked ? [...new Set([...S.memb, m])] : S.memb.filter(x => x !== m); store("memb", S.memb); }
 $("ncl").textContent = clubCount() ? `(${clubCount()})` : "";
});
$("clubs").addEventListener("click", e => {
 if (e.target.id === "addclub") { const v = $("newclub").value.trim(); if (v && !S.memb.includes(v)) { S.memb.push(v); store("memb", S.memb); } renderClubs(); }
 const rm = e.target.dataset.rm; if (rm) { S.memb = S.memb.filter(x => x !== rm); store("memb", S.memb); renderClubs(); }
});

getJSON("data/stores.json").then(d => {
 S.stores = d.stores; S.updated = d.updated || "";
 $("upd").textContent = S.updated ? "נתוני " + S.updated.split("-").reverse().join(".") : "";
 // a store missing from today's data stays selected: it comes back when its chain publishes again
 renderStores(); $("ncl").textContent = clubCount() ? `(${clubCount()})` : ""; if (![...S.sel].some(known)) tab(false); else renderBasket();
}).catch(() => { $("bask").innerHTML = '<div class="empty">הנתונים עדיין לא זמינים. נסה שוב אחרי הריצה הלילית.</div>'; });
</script>
</body>
</html>
