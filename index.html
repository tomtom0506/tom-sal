<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="tom-sal">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E1F44">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<title>tom-sal</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0E1F44;--blue:#1F3A6E;--gold:#D9A940;--silver:#C9D1DC;--bg:#F3F5F8;--card:#fff;--text:#14213D;--muted:#6B7689;--line:#E2E6EC;--green:#1B8A5A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1328;--card:#14213D;--text:#EEF1F6;--muted:#9AA6BA;--line:#24345A}}
:root[data-theme="dark"]{--bg:#0A1328;--card:#14213D;--text:#EEF1F6;--muted:#9AA6BA;--line:#24345A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Heebo,system-ui,-apple-system,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0}
.top{display:flex;align-items:center;gap:10px}
.top img{width:34px;height:34px;border-radius:9px}
.top h1{font-size:20px;margin:0;font-weight:700}
.top small{margin-inline-start:auto;color:var(--silver);font-size:12px}
nav{display:flex;margin-top:10px}
nav button{flex:1;background:none;border:0;color:var(--silver);font:inherit;font-size:16px;padding:10px;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-color:var(--gold);font-weight:500}
main{padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 90px);max-width:640px;margin:0 auto}
input[type=search]{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.grow{flex:1;min-width:0}
.name{font-weight:500}
.sub{color:var(--muted);font-size:13px}
.qty{display:flex;align-items:center;gap:8px}
.qty button,.add{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:18px}
.add{background:var(--navy);color:#fff;border:0}
h2{font-size:15px;color:var(--muted);font-weight:500;margin:20px 4px 0}
.store{padding:14px}
.store .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.total{font-size:22px;font-weight:700}
.reg{text-decoration:line-through;color:var(--muted);font-size:14px;margin-inline-end:6px}
.best{border:2px solid var(--gold)}
.badge{display:inline-block;background:var(--gold);color:#1a1a1a;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700;margin-inline-start:6px}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:0 6px;background:#E7F5EE;color:var(--green);margin-top:2px}
.tag.club{background:#FFF3D6;color:#8A5A00}
.miss{color:#C0392B;font-size:13px}
details summary{color:var(--muted);font-size:13px;margin-top:6px}
.line{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:4px 0;border-top:1px dashed var(--line)}
label.sw{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:15px}
.empty{color:var(--muted);text-align:center;padding:24px 10px}
.hidden{display:none}
.sbox{position:relative}
.sbox input{padding-inline-end:54px}
.scanb{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:42px;height:38px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:19px}
#scan{position:fixed;inset:0;z-index:12;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#scan.hidden{display:none}
#reader{width:100%;max-width:420px}
#scan p{color:#fff;margin:0;font-size:15px;text-align:center}
#scan .photo{color:#F2C75C;font-size:15px;text-decoration:underline}
#scan button{background:#fff;color:#000;border:0;border-radius:22px;padding:10px 26px;font:inherit;font-size:16px}
.price{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;justify-content:flex-end}
.ends{color:#C0392B;font-weight:700}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);z-index:13;background:var(--green);color:#fff;border-radius:12px;padding:10px 16px;font-size:15px;max-width:90%}
#toast.hidden{display:none}
.hb{background:rgba(255,255,255,.12);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px}
.ver{background:none;border:0;color:#F2C75C;font:inherit;font-size:13px;font-weight:500;padding:0;-webkit-appearance:none;appearance:none;opacity:1}
.meta{margin-inline-start:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.meta small{color:var(--silver);font-size:12px}
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%);z-index:6;background:var(--navy);color:#fff;border:1px solid var(--gold);border-radius:24px;padding:10px 20px;font:inherit;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#modal{position:fixed;inset:0;z-index:10;background:rgba(5,12,30,.6);display:flex;align-items:flex-end;justify-content:center}
#modal.hidden{display:none}
#modal .sheet{background:var(--card);color:var(--text);width:100%;max-width:640px;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
#modal h3{margin:0 0 6px;font-size:19px}
#modal h4{margin:16px 0 4px;font-size:15px}
#modal p,#modal li{font-size:15px;line-height:1.6;margin:4px 0}
#modal .close{float:left;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:50%;width:32px;height:32px;font-size:16px}
.cl{border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
.cl b{color:var(--gold)}
</style>
</head>
<body>
<header>
 <div class="top"><img src="apple-touch-icon.png" alt=""><h1>הסל שלי</h1>
  <div class="meta"><button class="ver" id="ver"></button><small id="upd"></small></div>
  <button class="hb" id="theme" aria-label="מצב יום או לילה">🌙</button>
  <button class="hb" id="help" aria-label="מדריך">❔</button></div>
 <nav><button id="tb" class="on">סל</button><button id="ts">סניפים <span id="nsel"></span></button></nav>
</header>
<main>
 <section id="vb">
  <div class="sbox"><input type="search" id="q" placeholder="חיפוש מוצר או ברקוד" autocomplete="off"><button class="scanb" id="scanb" aria-label="סריקת ברקוד">📷</button></div>
  <div id="res"></div>
  <div id="bask"></div>
  <label class="sw"><input type="checkbox" id="club"> לכלול מבצעי מועדון וכרטיס</label>
  <div id="cmp"></div>
 </section>
 <section id="vs" class="hidden"><div id="stores"></div></section>
</main>
<button class="fab" id="refresh">🔄 רענון</button>
<div id="scan" class="hidden"><p>כוון לברקוד ממרחק 15–20 ס"מ, באור טוב</p><div id="reader"></div><label class="photo">📸 לא מצליח? צלם תמונה של הברקוד<input type="file" id="photo" accept="image/*" capture="environment" hidden></label><button id="scanx">ביטול</button></div><div id="scanfile" hidden></div>
<div id="toast" class="hidden"></div>
<div id="modal" class="hidden"><div class="sheet" id="sheet"></div></div>
<script>
const VERSION = "1.3.0";
const CHANGELOG = [
 ["1.3.0", "28.10.2026", ["ירקות, פירות ומוצרים במשקל: מוצר אחד שמושווה בין כל הרשתות לפי השם", "חיפוש סלחני: מוצא תוצאות גם כשחלק מהמילים לא מופיעות בשם המוצר", "כמות של מוצר במשקל מוצגת בק\"ג"]],
 ["1.2.1", "27.10.2026", ["סריקה חדה יותר: רזולוציה גבוהה, פוקוס רציף ואזור סריקה רחב", "אפשרות לצלם תמונה של הברקוד כשהסריקה החיה לא מצליחה"]],
 ["1.2.0", "27.10.2026", ["סריקת ברקוד במצלמה מתוך תיבת החיפוש", "סימון מבצע שמסתיים היום", "רווח בין המחיר המחוק למחיר במבצע", "מספר גרסה קריא יותר"]],
 ["1.1.1", "27.10.2026", ["תיקון: שכבה כהה כיסתה את המסך וחסמה לחיצות"]],
 ["1.1.0", "27.10.2026", ["כפתור רענון שטוען את האפליקציה והנתונים מחדש", "מספר גרסה ויומן גרסאות", "מצב יום ולילה", "מדריך שימוש"]],
 ["1.0.0", "27.10.2026", ["גרסה ראשונה: בחירת סניפים, חיפוש מוצרים, סל, והשוואת מחיר הסל בין הסניפים כולל מבצעים ומבצעי מועדון"]],
];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ils = n => "₪" + n.toFixed(2);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const S = { stores: [], sel: new Set(load("sel", [])), basket: load("basket", {}), club: load("club", false), cat: null, files: {} };
$("club").checked = S.club;

async function getJSON(u) { const r = await fetch(u, { cache: "no-cache" }); if (!r.ok) throw new Error(u + " " + r.status); return r.json(); }
async function catalog() { if (!S.cat) { $("res").innerHTML = '<div class="empty">טוען קטלוג…</div>'; S.cat = await getJSON("data/catalog.json"); if ($("q").value.trim().length < 2) $("res").innerHTML = ""; } return S.cat; }
async function files() {
 await Promise.all([...S.sel].filter(s => !S.files[s]).map(async s => { S.files[s] = await getJSON(`data/s/${s}.json`); }));
}

// ---- stores view ----
function renderStores() {
 const by = {};
 S.stores.forEach(s => (by[s.he] ||= []).push(s));
 $("stores").innerHTML = Object.keys(by).sort((a, b) => a.localeCompare(b, "he")).map(ch =>
  `<h2>${esc(ch)}</h2><div class="box">` + by[ch].map(s =>
   `<label class="row"><input type="checkbox" data-sid="${s.sid}" ${S.sel.has(s.sid) ? "checked" : ""}>
    <div class="grow"><div class="name">${esc(s.name)}</div><div class="sub">${esc(s.address || "")}</div></div></label>`).join("") + "</div>"
 ).join("");
 $("nsel").textContent = S.sel.size ? `(${S.sel.size})` : "";
}
$("stores").addEventListener("change", e => {
 const sid = e.target.dataset.sid; if (!sid) return;
 e.target.checked ? S.sel.add(sid) : S.sel.delete(sid);
 store("sel", [...S.sel]); $("nsel").textContent = S.sel.size ? `(${S.sel.size})` : "";
});

// ---- search ----
let tmr;
$("q").addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(search, 250); });
async function search() {
 const q = $("q").value.trim();
 if (q.length < 2) { $("res").innerHTML = ""; return; }
 const cat = await catalog(); await files();
 const words = q.split(/\s+/).filter(Boolean), digits = /^\d{4,}$/.test(q), full = [], part = [];
 for (const code in cat) {
  const [n, m] = cat[code], t = n + " " + (m || "");
  if (digits) { if (code.includes(q)) full.push(code); continue; }
  let k = 0; for (const w of words) if (t.includes(w)) k++;
  if (k === words.length) full.push(code); else if (k > 0) part.push([code, k]);
 }
 part.sort((a, b) => b[1] - a[1]);
 const out = full.length >= 5 ? full : full.concat(part.slice(0, 300).map(x => x[0]));
 const have = c => [...S.sel].filter(s => cands(c).some(x => S.files[s]?.p[x])).length;
 const sc = {}; out.forEach(c => sc[c] = have(c));
 out.sort((a, b) => sc[b] - sc[a] || (b.startsWith("g:") - a.startsWith("g:")) || cat[a][0].length - cat[b][0].length);
 $("res").innerHTML = out.length ? '<div class="box">' + out.slice(0, 30).map(c => {
  const [n, m, qn, u] = cat[c];
  return `<div class="row"><div class="grow"><div class="name">${esc(n)}</div>
   <div class="sub">${c.startsWith("g:") ? "כל הרשתות" + (cat[c][4] ? " · במשקל" : "") : esc(m || "") + " " + (qn ? esc(qn + " " + (u || "")) : "")} · ב-${sc[c]} מתוך ${S.sel.size} סניפים</div></div>
   <button class="add" data-add="${esc(c)}">+</button></div>`;
 }).join("") + "</div>" : '<div class="empty">לא נמצא מוצר</div>';
}
$("res").addEventListener("click", e => {
 const c = e.target.dataset.add; if (!c) return;
 S.basket[c] = (S.basket[c] || 0) + 1; store("basket", S.basket);
 $("q").value = ""; $("res").innerHTML = ""; renderBasket();
});

// ---- basket + compare ----
async function renderBasket() {
 const codes = Object.keys(S.basket);
 if (!codes.length) { $("bask").innerHTML = '<div class="empty">הסל ריק. חפש מוצר כדי להתחיל.</div>'; $("cmp").innerHTML = ""; return; }
 const cat = await catalog(); await files();
 $("bask").innerHTML = "<h2>בסל</h2><div class='box'>" + codes.map(c => `<div class="row">
  <div class="grow"><div class="name">${esc(cat[c]?.[0] || c)}</div><div class="sub">${esc(cat[c]?.[1] || "")}</div></div>
  <div class="qty"><button data-d="${esc(c)}" data-v="-1">−</button><b>${S.basket[c]}${kg(c) ? ' ק"ג' : ""}</b><button data-d="${esc(c)}" data-v="1">+</button></div></div>`).join("") + "</div>";
 compare(cat);
}
$("bask").addEventListener("click", e => {
 const c = e.target.dataset.d; if (!c) return;
 S.basket[c] += +e.target.dataset.v; if (S.basket[c] <= 0) delete S.basket[c];
 store("basket", S.basket); renderBasket();
});
$("club").addEventListener("change", e => { S.club = e.target.checked; store("club", S.club); renderBasket(); });

function promoUnit(price, pr) {
 let [, , , mq, dp, dr] = pr; mq = mq || 1;
 if (dp != null && dp > 0) return mq > 1 && dp > price ? dp / mq : dp;  // "2 ב-20" = total for min qty
 if (dr) return price * (1 - (dr > 1 ? dr / 100 : dr));
 return null;
}
const TODAY = new Date().toLocaleDateString("sv-SE");
const cands = c => c.startsWith("g:") ? (S.cat?.[c]?.[5] || []) : [c];
const kg = c => c.startsWith("g:") && S.cat?.[c]?.[4];
const isClub = club => !/^\s*0/.test(String(club ?? "0"));

function compare(cat) {
 if (!S.sel.size) { $("cmp").innerHTML = '<div class="empty">בחר סניפים בלשונית "סניפים" כדי להשוות.</div>'; return; }
 const rows = [...S.sel].map(sid => {
  const f = S.files[sid], st = S.stores.find(s => s.sid === sid);
  if (!f || !st) return null;
  let reg = 0, tot = 0, miss = 0; const lines = [];
  for (const [c, q] of Object.entries(S.basket)) {
   let best = null, why = null, regp = null;
   for (const cc of cands(c)) {
    const p = f.p[cc]; if (!p || !(p[0] > 0)) continue;
    let b = p[0], w = null;
    for (const pid of f.l[cc] || []) {
     const pr = f.pr[pid]; if (!pr) continue;
     const club = isClub(pr[2]); if (club && !S.club) continue;
     if (q < (pr[3] || 1)) continue;
     const u = promoUnit(p[0], pr);
     if (u != null && u > 0 && u < b) { b = u; w = { d: pr[0], club, end: pr[1] }; }
    }
    if (best === null || b < best) { best = b; why = w; regp = p[0]; }
   }
   if (best === null) { miss++; continue; }
   reg += regp * q; tot += best * q;
   lines.push(`<div class="line"><span>${esc(cat[c]?.[0] || c)} ×${q}${kg(c) ? ' ק"ג' : ""}${why ? `<br><span class="tag ${why.club ? "club" : ""}">${why.club ? "מועדון: " : "מבצע: "}${esc(why.d)}${why.end ? (why.end === TODAY ? ' · <span class="ends">מסתיים היום</span>' : " · עד " + esc(why.end.split("-").reverse().join("."))) : ""}</span>` : ""}</span><b>${ils(best * q)}</b></div>`);
  }
  return { st, reg, tot, miss, lines };
 }).filter(Boolean).sort((a, b) => a.miss - b.miss || a.tot - b.tot);
 const n = Object.keys(S.basket).length;
 $("cmp").innerHTML = "<h2>השוואה</h2>" + rows.map((r, i) => `<div class="box store ${i === 0 && !r.miss ? "best" : ""}">
  <div class="t"><div><div class="name">${esc(r.st.he)}${i === 0 && !r.miss ? '<span class="badge">הכי זול</span>' : ""}</div><div class="sub">${esc(r.st.name)}</div></div>
  <div class="price"><span class="total">${ils(r.tot)}</span>${r.reg - r.tot > 0.005 ? `<span class="reg">${ils(r.reg)}</span>` : ""}</div></div>
  ${r.miss ? `<div class="miss">חסרים ${r.miss} מתוך ${n} פריטים, הסכום לא כולל אותם</div>` : ""}
  <details><summary>פירוט</summary>${r.lines.join("")}</details></div>`).join("");
}

// ---- barcode scanner ----
let scanner = null;
function toast(t) { $("toast").textContent = t; $("toast").classList.remove("hidden"); setTimeout(() => $("toast").classList.add("hidden"), 2500); }
function loadLib() {
 if (window.Html5Qrcode) return Promise.resolve();
 return new Promise((ok, bad) => { const sc = document.createElement("script");
  sc.src = "https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"; sc.onload = ok; sc.onerror = bad; document.head.appendChild(sc); });
}
async function stopScan() { try { if (scanner) { await scanner.stop(); scanner.clear(); } } catch {} scanner = null; $("scan").classList.add("hidden"); }
$("scanx").onclick = stopScan;
const FORMATS = () => { const F = Html5QrcodeSupportedFormats; return [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128]; };
// photo fallback: a still photo is far sharper than the live video on iPhone
function shrink(file, max = 1600) {
 return new Promise((ok, bad) => { const img = new Image(); img.onload = () => {
  const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = img.width * k; c.height = img.height * k; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  c.toBlob(b => ok(new File([b], "b.jpg", { type: "image/jpeg" })), "image/jpeg", 0.92); URL.revokeObjectURL(img.src);
 }; img.onerror = bad; img.src = URL.createObjectURL(file); });
}
$("photo").onchange = async e => {
 const f = e.target.files[0]; e.target.value = ""; if (!f) return;
 await stopScan(); toast("מפענח את התמונה…");
 try {
  await loadLib();
  const r = new Html5Qrcode("scanfile", { formatsToSupport: FORMATS(), verbose: false });
  const code = await r.scanFile(await shrink(f), false); r.clear(); onBarcode(code.trim());
 } catch { toast("לא נמצא ברקוד בתמונה. נסה שוב מקרוב ובאור טוב, או הקלד את המספר שמתחת לברקוד."); }
};
$("scanb").onclick = async () => {
 $("scan").classList.remove("hidden");
 try {
  await loadLib();
  scanner = new Html5Qrcode("reader", { formatsToSupport: FORMATS(), verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
  await scanner.start({ facingMode: "environment" }, {
   fps: 15,
   qrbox: (w, h) => ({ width: Math.floor(w * 0.9), height: Math.floor(Math.min(h * 0.4, w * 0.5)) }),
   videoConstraints: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: "continuous" }] }
  }, async code => { await stopScan(); onBarcode(code.trim()); });
 } catch (e) { await stopScan(); toast("לא ניתן לפתוח את המצלמה. אשר גישה למצלמה ב-Safari ונסה שוב."); }
};
async function onBarcode(code) {
 const cat = await catalog();
 const hit = [code, code.replace(/^0+/, ""), "0" + code].find(c => cat[c]);
 if (hit) { S.basket[hit] = (S.basket[hit] || 0) + 1; store("basket", S.basket); toast("נוסף לסל: " + cat[hit][0]); renderBasket(); }
 else { $("q").value = code; search(); toast("הברקוד " + code + " לא נמצא בסניפי האזור"); }
}

// ---- theme ----
function applyTheme() {
 const t = load("theme", null);
 if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
 const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
 $("theme").textContent = dark ? "☀️" : "🌙";
}
$("theme").onclick = () => {
 const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
 store("theme", dark ? "light" : "dark"); applyTheme();
};
applyTheme();

// ---- refresh ----
$("refresh").onclick = () => { $("refresh").textContent = "⏳ מרענן…"; location.replace(location.pathname + "?r=" + Date.now()); };

// ---- modal: changelog + guide ----
function openModal(html) { $("sheet").innerHTML = '<button class="close" id="mx">✕</button>' + html; $("modal").classList.remove("hidden"); $("mx").onclick = closeModal; }
function closeModal() { $("modal").classList.add("hidden"); }
$("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
$("ver").textContent = "v" + VERSION;
$("ver").onclick = () => openModal("<h3>יומן גרסאות</h3>" + CHANGELOG.map(([v, d, items]) =>
 `<div class="cl"><b>v${v}</b> <span class="sub">${d}</span><ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join(""));
$("help").onclick = () => openModal(`<h3>מדריך</h3>
 <p>האפליקציה משווה כמה יעלה הסל שלך בכל סניף באזור, לפי קובצי המחירים שהרשתות חייבות לפרסם לפי חוק.</p>
 <h4>1. בחירת סניפים</h4><p>בלשונית "סניפים" מסמנים את הסניפים שאתה קונה בהם או מוכן להגיע אליהם. הבחירה נשמרת בטלפון.</p>
 <h4>2. בניית סל</h4><p>בלשונית "סל" מחפשים מוצר בשם או במספר ברקוד ולוחצים + . בכל תוצאה מופיע בכמה מהסניפים שבחרת המוצר נמכר. את הכמות משנים עם + ו־−.</p>
 <h4>3. קריאת ההשוואה</h4><ul>
  <li>הסניף הזול ביותר מסומן במסגרת זהב ובתג "הכי זול".</li>
  <li>מחיר מחוק הוא המחיר בלי מבצעים, והמחיר הגדול כולל מבצעים.</li>
  <li>"חסרים X פריטים" אומר שהסניף לא מוכר חלק מהסל, והסכום שלו לא כולל אותם. סניפים כאלה מוצגים בסוף.</li>
  <li>בלחיצה על "פירוט" רואים מחיר לכל מוצר ואת תנאי המבצע ותוקפו.</li></ul>
 <h4>4. מבצעי מועדון</h4><p>כברירת מחדל החישוב כולל רק מבצעים לכל הלקוחות. סמן "לכלול מבצעי מועדון וכרטיס" אם אתה חבר במועדונים.</p>
 <h4>5. מתי הנתונים מתעדכנים</h4><p>פעם בלילה, בערך ב־03:00–04:00. תאריך העדכון מופיע למעלה. כפתור "רענון" טוען את הגרסה והנתונים העדכניים.</p>
 <h4>חשוב לדעת</h4><ul>
  <li>קרפור, סופר־פארם, חצי חינם, ויקטורי, מחסני השוק וח. כהן עדיין לא נכללים.</li>
  <li>מבצעים מסוג "2 ב־X" מחושבים לפי פירוש סביר של קובץ הרשת. תמיד אפשר לבדוק את נוסח המבצע ב"פירוט".</li>
  <li>המחיר בקופה עלול להיות שונה מעט מהמחיר בקובץ.</li></ul>
 <h4>התקנה במסך הבית</h4><p>ב־Safari: שתף ← הוסף למסך הבית.</p>`);

function tab(b) { $("vb").classList.toggle("hidden", !b); $("vs").classList.toggle("hidden", b); $("tb").classList.toggle("on", b); $("ts").classList.toggle("on", !b); if (b) renderBasket(); }
$("tb").onclick = () => tab(true); $("ts").onclick = () => tab(false);

getJSON("data/stores.json").then(d => {
 S.stores = d.stores; $("upd").textContent = "עודכן " + d.updated.split("-").reverse().join(".");
 const ok = new Set(S.stores.map(s => s.sid)); S.sel.forEach(s => ok.has(s) || S.sel.delete(s));
 renderStores(); if (!S.sel.size) tab(false); else renderBasket();
}).catch(() => { $("bask").innerHTML = '<div class="empty">הנתונים עדיין לא זמינים. נסה שוב אחרי הריצה הלילית.</div>'; });
</script>
</body>
</html>
